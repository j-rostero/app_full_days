name: fulldays_mobile
description: "App FullDays para viajeros y operadores (iOS y Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cryptography: ^2.9.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  fulldays_api:
    path: ../../packages/api_dart
  fulldays_ui:
    path: ../../packages/ui_flutter
  http: ^1.5.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
